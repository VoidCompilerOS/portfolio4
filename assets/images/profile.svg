<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" stroke-dasharray="4 4" />
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 4" />
    <line x1="160" y1="0" x2="160" y2="400" stroke-dasharray="4 4" />
    <line x1="240" y1="0" x2="240" y2="400" stroke-dasharray="4 4" />
    <line x1="300" y1="0" x2="300" y2="400" stroke-dasharray="4 4" />
    <line x1="360" y1="0" x2="360" y2="400" stroke-dasharray="4 4" />
    <line x1="0" y1="100" x2="400" y2="100" stroke-dasharray="4 4" />
    <line x1="0" y1="200" x2="400" y2="200" stroke-dasharray="4 4" />
    <line x1="0" y1="300" x2="400" y2="300" stroke-dasharray="4 4" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="150" fill="url(#glowGrad)" />

  <!-- Outer Ring with Gradient -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8" />
  <circle cx="200" cy="200" r="115" fill="#131c31" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Avatar Symbol / Monogram -->
  <!-- Stylized Monogram IG -->
  <g filter="url(#shadow)">
    <!-- Shield / Hexagon badge -->
    <polygon points="200,120 260,155 260,225 200,260 140,225 140,155" fill="none" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Tech nodes -->
    <circle cx="200" cy="120" r="5" fill="#38bdf8" />
    <circle cx="260" cy="155" r="5" fill="#818cf8" />
    <circle cx="260" cy="225" r="5" fill="#c084fc" />
    <circle cx="200" cy="260" r="5" fill="#38bdf8" />
    <circle cx="140" cy="225" r="5" fill="#818cf8" />
    <circle cx="140" cy="155" r="5" fill="#c084fc" />
    
    <!-- Monogram Text "IG" -->
    <text x="200" y="205" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="52" fill="url(#accentGrad)" letter-spacing="2">IG</text>
  </g>

  <!-- Status pill at bottom -->
  <g transform="translate(110, 310)">
    <rect width="180" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="url(#accentGrad)" stroke-width="1.2" />
    <circle cx="24" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" font-weight="500">Ishu Gautam · BCA</text>
  </g>
</svg>
